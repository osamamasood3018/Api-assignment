<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f0f4f8;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 60%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        img {
            margin-top: 20px;
            max-width: 200px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>QR Code Generator</h1>
    <input type="text" id="qrInput" placeholder="Enter text or URL">
    <button id="generateQR">Generate QR Code</button>
    <div id="qrCodeContainer">
        <img id="qrCode" alt="Generated QR Code" style="display:none;">
    </div>

    <script>
        document.getElementById('generateQR').addEventListener('click', () => {
            const inputText = document.getElementById('qrInput').value;
            if(inputText) {
                const qrCodeURL = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(inputText)}`;
                document.getElementById('qrCode').src = qrCodeURL;
                document.getElementById('qrCode').style.display = "block";
            } else {
                alert('Please enter some text or a URL to generate a QR code!');
            }
        });
    </script>
</body>
</html>
