<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advice API</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(120deg, #84fab0, #8fd3f4);
            color: #333;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00509e;
        }
        p {
            font-size: 18px;
            background: #ffffff;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            display: inline-block;
        }
        button {
            margin-top: 20px;
            background: #00509e;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #003f7f;
        }
    </style>
</head>
<body>
    <h1>Random Advice</h1>
    <button id="getAdvice">Get Advice</button>
    <p id="advice" style="margin-top: 20px;"></p>
    <script>
        document.getElementById('getAdvice').addEventListener('click', async () => {
            const response = await fetch('https://api.adviceslip.com/advice');
            const data = await response.json();
            document.getElementById('advice').textContent = `"${data.slip.advice}"`;
        });
    </script>
</body>
</html>
