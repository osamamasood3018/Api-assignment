<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Facts</title>
    <style>
        body {
            font-family: 'Comic Sans MS', sans-serif;
            background: #ffe5d9;
            color: #6a0572;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ff7e67;
        }
        p {
            font-size: 18px;
            margin: 20px auto;
            max-width: 600px;
            background: #fff;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        button {
            background: #ff7e67;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #e8503c;
        }
    </style>
</head>
<body>
    <h1>Random Cat Fact</h1>
    <button id="getFact">Get Cat Fact</button>
    <p id="fact"></p>
    <script>
        document.getElementById('getFact').addEventListener('click', async () => {
            const response = await fetch('https://meowfacts.herokuapp.com/');
            const data = await response.json();
            document.getElementById('fact').textContent = data.data[0];
        });
    </script>
</body>
</html>
