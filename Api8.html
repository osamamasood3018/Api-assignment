<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceX Launch Data</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #e8f5e9;
        }
        button {
            padding: 10px 20px;
            background-color: #388e3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2e7d32;
        }
        p {
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Latest SpaceX Launch</h1>
    <button id="getLaunch">Get Launch Info</button>
    <p id="launchInfo"></p>
    <script>
        document.getElementById('getLaunch').addEventListener('click', async () => {
            const response = await fetch('https://api.spacexdata.com/v4/launches/latest');
            const data = await response.json();
            document.getElementById('launchInfo').textContent = `Launch Name: ${data.name} | Date: ${new Date(data.date_utc).toLocaleString()}`;
        });
    </script>
</body>
</html>
