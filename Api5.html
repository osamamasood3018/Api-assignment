<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Definition</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #eef2f3;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #0077b6;
        }
        input {
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #0077b6;
            width: 200px;
        }
        button {
            background: #0077b6;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background: #00509e;
        }
        p {
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Dictionary Lookup</h1>
    <input type="text" id="word" placeholder="Enter word">
    <button id="getDefinition">Get Definition</button>
    <p id="definition"></p>
    <script>
        document.getElementById('getDefinition').addEventListener('click', async () => {
            const word = document.getElementById('word').value;
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
            const data = await response.json();
            if (data.title) {
                document.getElementById('definition').textContent = 'Word not found.';
            } else {
                document.getElementById('definition').textContent = 
                    `Definition of "${word}": ${data[0].meanings[0].definitions[0].definition}`;
            }
        });
    </script>
</body>
</html>
