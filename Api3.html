<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronomy Picture</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0d1b2a;
            color: #e0e1dd;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ffb703;
        }
        img {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            border: 2px solid #ffb703;
            border-radius: 10px;
        }
        button {
            background: #ffb703;
            color: #0d1b2a;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #fb8500;
        }
    </style>
</head>
<body>
    <h1>Astronomy Picture of the Day</h1>
    <button id="getPicture">Get Picture</button>
    <h3 id="title"></h3>
    <img id="apodImage" alt="Astronomy Picture" style="display:none;">
    <p id="explanation"></p>
    <script>
        document.getElementById('getPicture').addEventListener('click', async () => {
            const response = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
            const data = await response.json();
            document.getElementById('title').textContent = data.title;
            document.getElementById('apodImage').src = data.url;
            document.getElementById('apodImage').style.display = "block";
            document.getElementById('explanation').textContent = data.explanation;
        });
    </script>
</body>
</html>
