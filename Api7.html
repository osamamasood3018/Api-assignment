<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Checker</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-left: 10px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        p {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Crypto Price Checker</h1>
    <input type="text" id="crypto" placeholder="Enter cryptocurrency (e.g., bitcoin)">
    <button id="getPrice">Get Price</button>
    <p id="price"></p>
    <script>
        document.getElementById('getPrice').addEventListener('click', async () => {
            const crypto = document.getElementById('crypto').value.toLowerCase();
            const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${crypto}&vs_currencies=usd`);
            const data = await response.json();
            if (data[crypto]) {
                document.getElementById('price').textContent = `The current price of ${crypto} is $${data[crypto].usd}`;
            } else {
                document.getElementById('price').textContent = 'Cryptocurrency not found!';
            }
        });
    </script>
</body>
</html>
